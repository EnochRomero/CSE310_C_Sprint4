<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f0" />
    <title>Personal Budget Tracker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main>
        <section class="summary-grid" aria-label="Budget summary">
          <article class="summary-card balance-card">
            <div class="card-heading"><span>Available balance</span><span class="card-icon" aria-hidden="true">&#8599;</span></div>
            <p class="summary-amount">{{BALANCE}}</p>
            <p class="card-caption">Income minus expenses</p>
          </article>
          <article class="summary-card">
            <div class="card-heading"><span>Total income</span><span class="card-icon income-icon" aria-hidden="true">&#8595;</span></div>
            <p class="summary-amount">{{INCOME}}</p>
            <p class="card-caption">Money received</p>
          </article>
          <article class="summary-card">
            <div class="card-heading"><span>Total expenses</span><span class="card-icon expense-icon" aria-hidden="true">&#8593;</span></div>
            <p class="summary-amount">{{EXPENSES}}</p>
            <p class="card-caption">Money spent</p>
          </article>
        </section>

        <section class="content-grid">
          <article class="panel form-panel">
            <div class="section-heading">
              <div><p class="eyebrow">NEW ENTRY</p><h2>Add a transaction</h2></div>
              <span class="heading-spark" aria-hidden="true">&#10033;</span>
            </div>
            <form action="/add" method="post">
              <label for="description">What was it for?</label>
              <input id="description" name="description" type="text" maxlength="60" placeholder="e.g. Weekly groceries" required />

              <div class="field-row">
                <div class="field-group">
                  <label for="amount">Amount</label>
                  <div class="amount-input"><span>$</span><input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required /></div>
                </div>
                <div class="field-group">
                  <label for="type">Type</label>
                  <select id="type" name="type"><option value="expense">Expense</option><option value="income">Income</option></select>
                </div>
              </div>

              <label for="category">Category</label>
              <select id="category" name="category">
                <option>Food</option><option>Home</option><option>Transport</option><option>Shopping</option><option>Entertainment</option><option>Health</option><option>Salary</option><option>Other</option>
              </select>
              <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add transaction</button>
            </form>
          </article>

          <article class="panel transactions-panel">
            <div class="transactions-heading">
              <div><p class="eyebrow">YOUR ACTIVITY</p><h2>Recent transactions</h2></div>
              <span class="entry-count">{{COUNT}} entries</span>
            </div>
            <ul class="transaction-list">{{TRANSACTIONS}}</ul>
          </article>
        </section>
        <footer>Small steps add up. <span>&#10033;</span></footer>
      </main>
    </div>
  </body>
</html>
